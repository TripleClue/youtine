<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img" aria-label="Concept: a birthday party plan unpacks backwards into tasks, each with its own lead time">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8F7F2"/><stop offset="1" stop-color="#EAE8E2"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59421"/><stop offset="1" stop-color="#BC8DFF"/>
  </linearGradient>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.10"/>
  </filter>
</defs>
<style>
  text{font-family:'PP Frama',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .t{fill:#000}.g{fill:#7D7D7D}.b{font-weight:600}
</style>
<rect width="880" height="660" fill="url(#bg)"/>
<circle cx="780" cy="360" r="200" fill="#BC8DFF" opacity="0.06"/>
<circle cx="130" cy="200" r="120" fill="#F59421" opacity="0.04"/>

<!-- badge -->
<g filter="url(#sh)"><rect x="60" y="66" width="176" height="38" rx="19" fill="#FFFFFF"/></g>
<g transform="translate(76,74) scale(0.72)" fill="none" stroke="#BC8DFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
</g>
<text x="106" y="90" fill="#BC8DFF" font-size="12.5" class="b">Reusable plan</text>

<!-- timeline -->
<line x1="80" y1="360" x2="800" y2="360" stroke="#E4E1DA" stroke-width="4" stroke-linecap="round"/>
<line x1="140" y1="360" x2="780" y2="360" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

<!-- connectors -->
<g stroke="#D5D1C8" stroke-width="1.6" stroke-linecap="round">
  <line x1="140" y1="296" x2="140" y2="350"/>
  <line x1="300" y1="370" x2="300" y2="424"/>
  <line x1="440" y1="296" x2="440" y2="350"/>
  <line x1="570" y1="370" x2="570" y2="424"/>
</g>

<!-- task cards -->
<g filter="url(#sh)"><rect x="62" y="234" width="156" height="62" rx="16" fill="#FFFFFF"/></g>
<circle cx="86" cy="265" r="5" fill="#F59421"/><text x="100" y="262" class="t b" font-size="12.5">Send invitations</text>
<text x="100" y="279" class="g" font-size="10.5">Sat 4 Oct</text>

<g filter="url(#sh)"><rect x="222" y="424" width="156" height="62" rx="16" fill="#FFFFFF"/></g>
<circle cx="246" cy="455" r="5" fill="#F59421"/><text x="260" y="452" class="t b" font-size="12.5">Order the cake</text>
<text x="260" y="469" class="g" font-size="10.5">Sat 11 Oct</text>

<g filter="url(#sh)"><rect x="362" y="234" width="156" height="62" rx="16" fill="#FFFFFF"/></g>
<circle cx="386" cy="265" r="5" fill="#F59421"/><text x="400" y="262" class="t b" font-size="12.5">Wrap the present</text>
<text x="400" y="279" class="g" font-size="10.5">Thu 16 Oct</text>

<g filter="url(#sh)"><rect x="492" y="424" width="156" height="62" rx="16" fill="#FFFFFF"/></g>
<circle cx="516" cy="455" r="5" fill="#F59421"/><text x="530" y="452" class="t b" font-size="12.5">Collect the cake</text>
<text x="530" y="469" class="g" font-size="10.5">Sat, 11:00</text>

<!-- nodes -->
<g stroke="#FFFFFF" stroke-width="4">
  <circle cx="140" cy="360" r="10" fill="#F59421"/>
  <circle cx="300" cy="360" r="10" fill="#F59421"/>
  <circle cx="440" cy="360" r="10" fill="#F59421"/>
  <circle cx="570" cy="360" r="10" fill="#F59421"/>
</g>
<g class="g" font-size="11" text-anchor="middle">
  <text x="140" y="398">2 weeks before</text><text x="300" y="398">1 week before</text>
  <text x="440" y="398">2 days before</text><text x="570" y="398">3 hours before</text>
</g>

<!-- event anchor -->
<circle cx="780" cy="360" r="34" fill="#BC8DFF" opacity="0.16"/>
<circle cx="780" cy="360" r="22" fill="#BC8DFF" stroke="#FFFFFF" stroke-width="4"/>
<text x="780" y="306" text-anchor="middle" class="t b" font-size="15">Lucy's birthday</text>
<text x="780" y="324" text-anchor="middle" class="g" font-size="11">Sat, 14:00</text>
<text x="780" y="412" text-anchor="middle" fill="#BC8DFF" font-size="11" class="b">The event</text>

<text x="440" y="576" text-anchor="middle" class="g" font-size="13">Build the plan once. Every task finds its own moment.</text>
</svg>
