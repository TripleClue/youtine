<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" width="880" height="660" role="img" aria-label="Concept: scattered reminders from many places gathered into one calm daily view">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8F7F2"/><stop offset="1" stop-color="#EAE8E2"/>
  </linearGradient>
  <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.10"/>
  </filter>
  <filter id="sh2" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.07"/>
  </filter>
</defs>
<style>
  text{font-family:'PP Frama',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .t{fill:#000}.g{fill:#7D7D7D}.b{font-weight:600}
</style>
<rect width="880" height="660" fill="url(#bg)"/>
<circle cx="670" cy="330" r="230" fill="#BC8DFF" opacity="0.05"/>
<circle cx="120" cy="120" r="110" fill="#F59421" opacity="0.04"/>

<!-- SCATTERED -->
<g opacity="0.9">
  <g transform="rotate(-7 137 154)" filter="url(#sh2)"><rect x="52" y="132" width="170" height="44" rx="13" fill="#FFFFFF"/></g>
  <g transform="rotate(-7 137 154)"><circle cx="74" cy="154" r="4.5" fill="#F59421"/><text x="90" y="159" class="g" font-size="12.5">PE kit on Thursday</text></g>

  <g transform="rotate(5 183 236)" filter="url(#sh2)"><rect x="104" y="214" width="158" height="44" rx="13" fill="#FFFFFF"/></g>
  <g transform="rotate(5 183 236)"><circle cx="126" cy="236" r="4.5" fill="#BC8DFF"/><text x="142" y="241" class="g" font-size="12.5">Call the dentist</text></g>

  <g transform="rotate(-3 132 318)" filter="url(#sh2)"><rect x="44" y="296" width="176" height="44" rx="13" fill="#FFFFFF"/></g>
  <g transform="rotate(-3 132 318)"><circle cx="66" cy="318" r="4.5" fill="#F59421"/><text x="82" y="323" class="g" font-size="12.5">Form due Friday</text></g>

  <g transform="rotate(8 178 400)" filter="url(#sh2)"><rect x="96" y="378" width="164" height="44" rx="13" fill="#FFFFFF"/></g>
  <g transform="rotate(8 178 400)"><circle cx="118" cy="400" r="4.5" fill="#F59421"/><text x="134" y="405" class="g" font-size="12.5">Milk, bread, apples</text></g>

  <g transform="rotate(-5 141 482)" filter="url(#sh2)"><rect x="56" y="460" width="170" height="44" rx="13" fill="#FFFFFF"/></g>
  <g transform="rotate(-5 141 482)"><circle cx="78" cy="482" r="4.5" fill="#BC8DFF"/><text x="94" y="487" class="g" font-size="12.5">Swim class 15:30</text></g>
</g>
<text x="140" y="560" text-anchor="middle" class="g" font-size="12">In your head, your texts, the fridge door</text>

<!-- CONVERGE -->
<g fill="none" stroke="#C6C2B8" stroke-width="1.6" stroke-dasharray="5 7" stroke-linecap="round">
  <path d="M232 150 C340 148 400 244 494 292"/>
  <path d="M272 236 C356 234 424 282 494 314"/>
  <path d="M228 314 C336 314 404 326 494 332"/>
  <path d="M268 402 C356 402 424 372 494 350"/>
  <path d="M234 478 C346 478 404 410 494 370"/>
</g>

<!-- GATHERED -->
<g filter="url(#sh)"><rect x="512" y="140" width="316" height="390" rx="26" fill="#FFFFFF"/></g>
<text x="540" y="188" class="t b" font-size="20">Today</text>
<text x="540" y="209" class="g" font-size="11">Tuesday 10 November</text>
<rect x="736" y="170" width="66" height="24" rx="12" fill="#BC8DFF" opacity="0.14"/>
<text x="769" y="186" text-anchor="middle" fill="#BC8DFF" font-size="10.5" class="b">5 things</text>
<g>
  <rect x="540" y="230" width="260" height="50" rx="10" fill="#F8F7F2"/><rect x="540" y="238" width="4" height="34" rx="2" fill="#F59421"/>
  <text x="560" y="251" class="g" font-size="9.5">08:00</text><text x="560" y="268" class="t b" font-size="12.5">Pack the PE kit</text>
  <rect x="540" y="288" width="260" height="50" rx="10" fill="#F8F7F2"/><rect x="540" y="296" width="4" height="34" rx="2" fill="#BC8DFF"/>
  <text x="560" y="309" class="g" font-size="9.5">09:30</text><text x="560" y="326" class="t b" font-size="12.5">Call the dentist</text>
  <rect x="540" y="346" width="260" height="50" rx="10" fill="#F8F7F2"/><rect x="540" y="354" width="4" height="34" rx="2" fill="#F59421"/>
  <text x="560" y="367" class="g" font-size="9.5">12:00</text><text x="560" y="384" class="t b" font-size="12.5">Form due</text>
  <rect x="540" y="404" width="260" height="50" rx="10" fill="#F8F7F2"/><rect x="540" y="412" width="4" height="34" rx="2" fill="#BC8DFF"/>
  <text x="560" y="425" class="g" font-size="9.5">15:30</text><text x="560" y="442" class="t b" font-size="12.5">Swim class</text>
  <rect x="540" y="462" width="260" height="50" rx="10" fill="#F8F7F2"/><rect x="540" y="470" width="4" height="34" rx="2" fill="#F59421"/>
  <text x="560" y="483" class="g" font-size="9.5">17:00</text><text x="560" y="500" class="t b" font-size="12.5">Shopping</text>
</g>
<text x="670" y="560" text-anchor="middle" class="g" font-size="12">One calm view, in order, for everyone</text>
</svg>
