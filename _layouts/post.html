---
layout: default
---
<article>
    <div class="page-hero">
        <div class="page-hero-inner">
            <a class="page-label" href="/blog/">Blog</a>
            <h1>{{ page.title }}</h1>
            <p class="page-hero-meta">
                {{ page.date | date: "%-d %B %Y" }}{% if page.author %} · {{ page.author }}{% endif %}
            </p>
        </div>
    </div>
    <div class="page-content">
        <div class="page-content-inner post-content">
            {{ content }}
            <a class="post-back" href="/blog/">← Back to all posts</a>
        </div>
    </div>
</article>
