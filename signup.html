<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be first to know — Youtine</title>
    <meta name="description" content="Sign up to be first to know when Youtine launches. The family app for all the invisible work.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
        @font-face {
            font-family: 'PP Frama';
            src: url('PPFramaText-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'PP Frama';
            src: url('PPFramaText-Medium.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --color-bg: #F8F7F2;
            --color-bg-warm: #EDECE9;
            --color-text: #000000;
            --color-text-secondary: #7D7D7D;
            --color-text-light: #757981;
            --color-accent: #BC8DFF;
            --color-accent-warm: #F59421;
            --color-white: #FFFFFF;
            --color-border: #EBE9E3;
            --font-sans: 'PP Frama', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-sans);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: inherit; text-decoration: none; }

        /* NAV */
        .nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(248, 247, 242, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-border);
        }
        .nav-inner {
            max-width: 1120px; margin: 0 auto; padding: 1rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: var(--font-sans); font-size: 1.5rem;
            color: var(--color-text); letter-spacing: -0.01em;
        }
        .nav-back {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }
        .nav-back:hover { color: var(--color-text); }

        /* PAGE */
        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7rem 1.5rem 4rem;
        }

        .page-inner {
            width: 100%;
            max-width: 560px;
        }

        .page-badge {
            display: inline-block;
            background: rgba(188, 141, 255, 0.12);
            color: var(--color-accent);
            padding: 0.4rem 1rem;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-bottom: 1.5rem;
        }

        .form-wrap {
            background: var(--color-white);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--color-border);
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }

        /* FOOTER */
        .footer {
            background: var(--color-text);
            border-top: 1px solid rgba(248, 247, 242, 0.1);
            padding: 2rem 1.5rem;
        }
        .footer-inner {
            max-width: 1120px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 1rem;
        }
        .footer-logo {
            font-family: var(--font-sans); font-size: 1.2rem; color: #F8F7F2;
        }
        .footer-links { display: flex; gap: 2rem; list-style: none; flex-wrap: wrap; }
        .footer-links a {
            font-size: 0.85rem; color: rgba(248, 247, 242, 0.5);
            transition: color 0.2s;
        }
        .footer-links a:hover { color: #F8F7F2; }
        .footer-social { display: flex; gap: 1rem; }
        .footer-social a {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(248, 247, 242, 0.1); color: rgba(248, 247, 242, 0.5);
            transition: background 0.2s, color 0.2s;
        }
        .footer-social a:hover { background: rgba(248, 247, 242, 0.2); color: #F8F7F2; }

        @media (max-width: 600px) {
            .form-wrap { padding: 1.5rem; }
            .footer-inner { flex-direction: column; text-align: center; }
            .footer-links { justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo"><img src="images/logo.png" alt="Youtine" height="48" onerror="this.style.display='none';this.nextSibling.style.display='inline';"><span style="display:none;">Youtine</span></a>
            <a href="/" class="nav-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Back to home
            </a>

    </nav>

    <div class="page">

            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <a href="/" class="footer-logo"><img src="images/logo-white.png" alt="Youtine" height="40" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';"><span style="display:none;">Youtine</span></a>
            <ul class="footer-links">

                <li><a href="/terms">User Agreement</a></li>
            </ul>
            <div class="footer-social">
                <a href="https://www.instagram.com/youtine.app" aria-label="Instagram">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61583936220808" aria-label="Facebook">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                </a>
                <a href="https://x.com/getyoutine" aria-label="X">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>

                </a>
            </div>
        </div>
    </footer>

</body>
</html>
